[tool.poetry]
name = "genai_docs_helper"
version = "0.1.0"
description = ""
authors = ["Ali Zarreh <alireza.zarreh@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

# Core LangChain packages
langchain = "^0.3.24"
langchain-core = "^0.3.56"
langchain-community = "^0.3.23"
langchain-text-splitters = "^0.3.8"
langchain-chroma = "^0.2.6"
langchain-openai = "^0.3.27"
langchain-ollama = "^0.3.3"

# LangGraph packages
langgraph = "^0.6.8"
langgraph-cli = "^0.4.2"
langgraph-api = "^0.4.35"
langgraph-runtime-inmem = "^0.14.1"

# Vector database and embeddings
chromadb = ">=1.1.0"

# LLM and API packages
langsmith = "^0.3.38"

# Data processing and utilities
numpy = "^2.0.0"
pydantic = "^2.0.0"
tqdm = "^4.0.0"

# Environment and configuration
python-dotenv = "^1.0.0"

# Optional: Redis for caching (can be disabled)
redis = {version = "^6.2.0", optional = true}

# Documentation
pdoc = "^15.0.4"

# Development tools
black = "^25.1.0"
isort = "^6.0.1"
autoflake = "^2.3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
pytest-cov = "^6.2.1"
pytest-mock = "^3.14.1"
pytest-timeout = "^2.4.0"
pytest-xdist = "^3.8.0"

[tool.poetry.extras]
redis = ["redis"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"